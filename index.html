<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c1f24">
<title>Ficha da ave · Linhavi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b2f36'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23c9a14a'/%3E%3C/svg%3E">
<style>
:root{--g:#2b2f36;--g2:#1c1f24;--ouro:#c9a14a;--ouroE:#a57c2f;--ouroCl:#f4ecd9;--bg:#f6f5f2;--card:#fff;--linha:#e5e2db;--tinta:#1e1f22;--suave:#6b6f76;--m:#2a5c9a;--f:#a3456e}
@media (prefers-color-scheme:dark){:root{--bg:#141619;--card:#1e2126;--linha:#2e3238;--tinta:#eceae5;--suave:#9a9ea6;--ouroCl:#2c261a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tinta);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.topo{background:linear-gradient(160deg,#2b2f36,#1c1f24 70%);color:#fff;padding:22px 18px 64px;text-align:center;position:relative}
.topo .logo{width:64px;height:60px;margin:0 auto 6px;display:block}
.topo .cri{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouro);font-weight:700}
.topo .sub{font-size:12.5px;color:#b9bcc2;margin-top:2px}
main{max-width:560px;margin:-46px auto 0;padding:0 14px 28px;position:relative}
.card{background:var(--card);border:1px solid var(--linha);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08);overflow:hidden}
.id{padding:20px 20px 16px;border-bottom:1px solid var(--linha)}
.an{display:inline-block;font:700 12.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--ouroCl);color:var(--ouroE);border:1px solid rgba(201,161,74,.45);padding:6px 9px;border-radius:8px}
h1{font:700 27px/1.15 Georgia,"Times New Roman",serif;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--linha);color:var(--tinta)}
.chip.M{color:var(--m);border-color:rgba(42,92,154,.35)}.chip.F{color:var(--f);border-color:rgba(163,69,110,.35)}
dl{margin:0;padding:6px 20px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:0}
dt,dd{padding:10px 0;border-bottom:1px solid var(--linha);margin:0}dt{color:var(--suave);font-size:13px;padding-right:16px}dd{font-weight:600;text-align:right}
dl>*:nth-last-child(-n+2){border-bottom:0}
h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ouroE);margin:22px 4px 10px}
.arv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:12px 13px;border-left:4px solid var(--m)}
.p.mae{border-left-color:var(--f)}
.p .r{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);font-weight:700}
.p .n{font-weight:700;margin-top:3px;word-break:break-word}.p .a{font:12px ui-monospace,Consolas,monospace;color:var(--suave);margin-top:2px;word-break:break-all}
.av{margin-top:8px;padding-top:8px;border-top:1px dashed var(--linha);font-size:12.5px;color:var(--suave)}
.av b{font:600 12px ui-monospace,Consolas,monospace;color:var(--tinta)}
.nd{color:var(--suave);font-weight:500;font-style:italic}
.cont{margin-top:14px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.cont .t{flex:1}.cont .t b{display:block}.cont .t span{font-size:13px;color:var(--suave)}
.wa{display:inline-flex;align-items:center;gap:8px;background:#1f8f4e;color:#fff;text-decoration:none;font-weight:700;padding:11px 14px;border-radius:12px;font-size:14px;white-space:nowrap}
.wa svg{width:18px;height:18px}
footer{text-align:center;color:var(--suave);font-size:12px;margin-top:22px}
footer b{color:var(--ouroE)}
.erro{padding:28px 22px;text-align:center}.erro h1{font-size:22px}
</style>
</head>
<body>
<header class="topo">
<div class="logo"><svg viewBox="0 0 170 160"><defs> <linearGradient id="gmL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a606a"/><stop offset=".55" stop-color="#343941"/><stop offset="1" stop-color="#1c1f24"/></linearGradient> <linearGradient id="gtL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0bd72"/><stop offset="1" stop-color="#a57c2f"/></linearGradient> <linearGradient id="goL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dc9b"/><stop offset=".5" stop-color="#c9a14a"/><stop offset="1" stop-color="#8a6a24"/></linearGradient></defs><path d="M92 72 C 96 40, 116 16, 140 18 C 156 20, 164 36, 159 52 C 154 38, 144 31, 131 33 C 114 37, 104 54, 99 76 Z" fill="url(#gmL)"/><path d="M96 78 C 106 54, 126 44, 143 48 C 155 52, 160 64, 157 78 C 151 66, 141 60, 129 62 C 116 64, 107 72, 100 84 Z" fill="url(#gtL)"/><path d="M98 86 C 112 74, 130 72, 141 80 C 149 86, 151 96, 148 106 C 142 95, 132 90, 121 90 C 112 90, 105 92, 100 96 Z" fill="#7b818b"/><g stroke="url(#goL)" stroke-width="1.8" fill="none" stroke-linecap="round"><path d="M114 38 C 110 30, 104 27, 98 28"/><path d="M130 58 C 130 50, 135 44, 141 42"/><path d="M128 86 C 130 80, 134 76, 139 75"/></g><g fill="url(#goL)"><circle cx="159" cy="54" r="5"/><circle cx="157" cy="80" r="4.6"/><circle cx="148" cy="108" r="4.2"/><circle cx="97" cy="28" r="3"/><circle cx="142" cy="41.5" r="3"/><circle cx="140" cy="74.5" r="2.8"/></g><path d="M46 24 C 56 22, 62 30, 60 40 C 59 48, 62 56, 72 62 C 80 67, 88 69, 96 68 C 102 82, 100 98, 88 108 C 80 116, 68 120, 58 118 C 42 114, 32 100, 32 84 C 32 70, 38 60, 40 52 C 41 47, 38 42, 38 36 C 38 29, 40 25, 46 24 Z" fill="url(#gmL)"/><g stroke="#5a606a" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"><path d="M56 44 C 56 52, 60 58, 66 62"/><path d="M52 48 C 52 56, 55 62, 60 66"/><path d="M47 52 C 47 60, 50 66, 54 70"/></g><path d="M56 84 C 68 74, 88 76, 96 88 C 86 86, 76 90, 70 102 C 62 98, 56 92, 56 84 Z" fill="url(#gtL)"/><g stroke="#f3d9c6" stroke-width="1.1" fill="none" opacity=".6" stroke-linecap="round"><path d="M62 86 C 72 80, 84 81, 90 86"/><path d="M64 91 C 72 86, 80 87, 85 90"/></g><path d="M39 26 C 35 18, 41 13, 45 19 C 45 10, 54 9, 54 18 C 57 11, 65 13, 62 21 C 66 18, 70 22, 66 27 C 60 28, 50 27, 39 26 Z" fill="url(#gtL)"/><path d="M38 31 Q 30 33 25 37.5 Q 31 39.5 38.5 40 Z" fill="url(#goL)"/><path d="M38 42 C 33 45, 33 54, 39 54 C 42 51, 42 45, 38 42 Z" fill="url(#gtL)"/><circle cx="46.5" cy="33" r="2.8" fill="#fffdf8"/><circle cx="46" cy="33.2" r="1.3" fill="#1f2616"/><g stroke="url(#goL)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M60 118 L 58 136 L 51 142 M58 136 L 64 142 M59 128 L 64 126"/><path d="M76 116 L 79 136 L 72 142 M79 136 L 86 142 M78 127 L 83 125"/></g></svg></div>
<div class="cri" id="cri">Linhavi</div>
<div class="sub" id="sub">Ficha genealógica da ave</div>
</header>
<main id="app"></main>
<script>
(function(){
  "use strict";
  var el=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function dec(s){try{return decodeURIComponent(String(s||'').replace(/\+/g,' '));}catch(e){return String(s||'');}}
  function erro(t,d){el.innerHTML='<div class="card erro"><h1>'+esc(t)+'</h1><p style="color:var(--suave)">'+esc(d)+'</p></div><footer>Gerado pelo <b>Linhavi</b> · gestão de criatório</footer>';}
  var h=location.hash.replace(/^#/,'');
  if(!h){erro('Aponte a câmera para o QR code de uma ave','Esta página mostra a ficha genealógica das aves registradas no Linhavi.');return;}
  var f=h.split('*').map(dec);
  if(f[0]!=='1'||!f[1]){erro('QR code não reconhecido','O código lido não é uma ficha válida do Linhavi.');return;}
  // 1*anilha*nome*sexo*raça*cor*nascimento*paiAnilha*paiNome*maeAnilha*maeNome*criatório*cidade*telefone*situação
  var A={an:f[1],nome:f[2],sx:f[3],raca:f[4],cor:f[5],nasc:f[6],pa:f[7],pn:f[8],ma:f[9],mn:f[10],cri:f[11],cid:f[12],tel:f[13],st:f[14]};
  document.title=(A.nome||A.an)+' · '+(A.cri||'Linhavi');
  if(A.cri)document.getElementById('cri').textContent=A.cri;
  if(A.cid)document.getElementById('sub').textContent='Ficha genealógica · '+A.cid;
  var SX={M:'Macho',F:'Fêmea'};
  function data(d){return /^\d{8}$/.test(d)?d.slice(6,8)+'/'+d.slice(4,6)+'/'+d.slice(0,4):'';}
  function idade(d){if(!/^\d{8}$/.test(d))return '';var n=new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)),h=new Date();var m=(h.getFullYear()-n.getFullYear())*12+(h.getMonth()-n.getMonth());if(h.getDate()<n.getDate())m--;if(m<0)return '';if(m<1){var dd=Math.max(0,Math.round((h-n)/864e5));return dd+(dd===1?' dia':' dias');}var a=Math.floor(m/12),r=m%12;return (a?a+(a>1?' anos':' ano'):'')+(a&&r?' e ':'')+(r?r+(r>1?' meses':' mês'):'');}
  function pai(rot,an,nm,cls,av1,av2){
    var tem=an||nm;
    return '<div class="p '+cls+'"><div class="r">'+rot+'</div>'+(tem?'<div class="n">'+esc(nm||an)+'</div>'+(nm&&an&&nm!==an?'<div class="a">'+esc(an)+'</div>':''):'<div class="n nd">Não registrado</div>')
      +((av1||av2)?'<div class="av">Avô <b>'+esc(av1||'—')+'</b><br>Avó <b>'+esc(av2||'—')+'</b></div>':'')+'</div>';
  }
  var linhas=[['Anilha',A.an],['Sexo',SX[A.sx]||''],['Raça',A.raca],['Plumagem / cor',A.cor],['Nascimento',data(A.nasc)],['Idade',idade(A.nasc)],['Situação',A.st]].filter(function(x){return x[1];});
  var tel=String(A.tel||'').replace(/\D/g,'');if(tel&&tel.length<=11)tel='55'+tel;
  el.innerHTML='<div class="card"><div class="id"><span class="an">'+esc(A.an)+'</span><h1>'+esc(A.nome||A.an)+'</h1>'
    +'<div class="chips">'+(A.sx&&SX[A.sx]?'<span class="chip '+A.sx+'">'+(A.sx==='M'?'♂ ':'♀ ')+SX[A.sx]+'</span>':'')+(A.raca?'<span class="chip">'+esc(A.raca)+'</span>':'')+(idade(A.nasc)?'<span class="chip">'+esc(idade(A.nasc))+'</span>':'')+'</div></div>'
    +'<dl>'+linhas.map(function(x){return '<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>';}).join('')+'</dl></div>'
    +'<h2>Genealogia</h2><div class="arv">'+pai('Pai',A.pa,A.pn,'',A.pp,A.pm)+pai('Mãe',A.ma,A.mn,'mae',A.mp,A.mm)+'</div>'
    +(A.cri||tel?'<div class="card cont"><div class="t"><b>'+esc(A.cri||'Criatório')+'</b><span>'+esc(A.cid||'Criador responsável')+'</span></div>'
      +(tel.length>=12?'<a class="wa" href="https://wa.me/'+tel+'?text='+encodeURIComponent('Olá! Vi a ficha da ave '+(A.nome||A.an)+' ('+A.an+') e quero mais informações.')+'" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2-.2-.2-.4-.3z"/></svg>WhatsApp</a>':'')+'</div>':'')
    +'<footer>Ficha gerada pelo <b>Linhavi</b> · os dados ficam no próprio QR code</footer>';
})();
</script>
</body>
</html>
